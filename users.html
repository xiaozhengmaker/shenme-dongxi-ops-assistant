<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>成员样本 · 社么东西</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #F5F6F7; color: #1f2329;
         font: 14px/1.5 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 20px 24px 60px; }
  header { display: flex; align-items: center; gap: 12px; background: #fff; padding: 14px 20px;
           border-radius: 10px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  header img { width: 26px; height: 26px; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .grow { flex: 1; }
  a.btn, button.btn { border: 1px solid #dfe3e8; background: #fff; color: #1f2329; padding: 7px 14px;
           border-radius: 8px; font-size: 13px; cursor: pointer; text-decoration: none; }
  a.primary { background: #3370FF; border-color: #3370FF; color: #fff; }
  .stats { display: flex; gap: 12px; margin: 16px 0; flex-wrap: wrap; }
  .stat { flex: 1 1 170px; background: #fff; border-radius: 10px; padding: 14px 16px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .stat b { display: block; font-size: 22px; color: #1f2329; }
  .stat span { color: #8f959e; font-size: 12px; }
  .platcard { flex: 1 1 100%; background: #fff; border-radius: 10px; padding: 14px 16px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .platcard h3 { margin: 0 0 10px; font-size: 13px; color: #8f959e; font-weight: 500; }
  .platrow { display: grid; grid-template-columns: 110px 1fr 150px; gap: 10px; align-items: center; padding: 5px 0; font-size: 13px; }
  .platrow .bar { height: 8px; background: #eef1f5; border-radius: 99px; overflow: hidden; }
  .platrow .bar i { display: block; height: 100%; background: #3370FF; border-radius: 99px; }
  .platrow .num { text-align: right; color: #5a6066; white-space: nowrap; }
  .pill.st { background: #f0f0ff; color: #5b4bd6; }
  .pill.rd { background: #fff1ee; color: #d4380d; }
  .pill.dc { background: #eef0ff; color: #4b53bc; }
  .stat { flex: 1; background: #fff; border-radius: 10px; padding: 14px 16px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .stat b { display: block; font-size: 22px; font-weight: 600; }
  .stat span { font-size: 12px; color: #8f959e; }
  .filters { display: flex; gap: 10px; flex-wrap: wrap; background: #fff; border-radius: 10px;
             padding: 12px 16px; box-shadow: 0 1px 2px rgba(0,0,0,.04); margin-bottom: 12px; }
  .filters input, .filters select { border: 1px solid #dfe3e8; border-radius: 8px; padding: 7px 10px; font-size: 13px; }
  .filters input[type=text] { flex: 1; min-width: 180px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden;
          box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  th, td { text-align: left; padding: 10px 12px; font-size: 13px; border-bottom: 1px solid #f0f1f2; }
  th { background: #fafbfc; color: #8f959e; font-weight: 500; }
  td.name { font-weight: 500; }
  td:nth-child(4) { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; }
  .pill.fb { background: #eef3ff; color: #3370FF; }
  .pill.tg { background: #e8f6ff; color: #0b7fc4; }
  .pill.mod { background: #fff3e6; color: #d46b08; }
  .pager { display: flex; align-items: center; gap: 12px; margin-top: 12px; color: #8f959e; font-size: 13px; }
  .empty { padding: 40px; text-align: center; color: #8f959e; }
  .name a { color: #2b6cf6; text-decoration: none; }
  .name a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="/icons/icon32.png" alt="" onerror="this.style.display='none'">
    <h1>成员样本</h1>
    <span class="grow"></span>
    <a class="btn" href="/">返回看板</a>
    <a class="btn primary" href="/api/users/export">导出 CSV</a>
  </header>

  <section class="stats" id="stats"></section>

  <section class="filters">
    <input id="q" type="text" placeholder="搜索昵称 / 用户名 / 群名">
    <select id="platform">
      <option value="">全部平台</option>
    </select>
    <select id="role">
      <option value="">全部角色</option>
      <option value="管理员">仅管理员/版主</option>
      <option value="成员">仅普通成员</option>
    </select>
    <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:#5a6066">
      <input id="uname" type="checkbox"> 只看有用户名
    </label>
    <button class="btn" id="btnSearch">筛选</button>
    <button class="btn" id="btnReset">重置</button>
  </section>

  <table>
    <thead>
      <tr><th style="width:26%">昵称</th><th style="width:18%">用户名</th><th style="width:14%">平台</th>
          <th style="width:24%">所属群</th><th style="width:10%">角色</th><th style="width:8%">采集日</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="pager">
    <button class="btn" id="prev">上一页</button>
    <span id="pageInfo">—</span>
    <button class="btn" id="next">下一页</button>
  </div>
</div>

<script src="/src_users.js"></script>
</body>
</html>
