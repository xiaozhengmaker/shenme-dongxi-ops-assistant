name: lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  static:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: PowerShell / JSON / Python / Markdown 检查
        shell: pwsh
        run: ./scripts/lint.ps1